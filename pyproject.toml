[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "main.py",
    "tests/*",
    "venv/*",
    ".venv/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".venv", "build", "dist", "TTS"]

[tool.ruff.lint]
# Foco en bugs reales, no en estilo cosmético.
# server.py tiene imports tardíos intencionados (workarounds de torch/TTS/numba)
# y multi-statement lines en compat shims — esos warnings son ruido.
select = [
    "F",   # pyflakes — unused imports, undefined names, etc.
    "W",   # pycodestyle warnings (whitespace, etc.)
    "I",   # isort
    "B",   # flake8-bugbear — bugs likely
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # function call in default arg (FastAPI Depends pattern)
    "B904",  # raise from inside except — explicit chaining no se usa en este código
]

[tool.ruff.lint.per-file-ignores]
"tests/*"  = ["E402", "F401"]
"server.py" = ["E402", "F401"]  # imports tardíos intencionados (compat numba/torch)
